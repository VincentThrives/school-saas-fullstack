<mat-toolbar class="app-header">
  <!-- Left side -->
  <div class="header-left">
    <button mat-icon-button class="menu-toggle" (click)="onMenuToggle()" aria-label="Toggle sidebar">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="page-title" *ngIf="pageTitle">{{ pageTitle }}</span>
    <span class="school-name" *ngIf="!pageTitle && schoolName">{{ schoolName }}</span>
  </div>

  <!-- Right side -->
  <div class="header-right">
    <!-- Dark mode toggle -->
    <button
      mat-icon-button
      class="header-icon-btn"
      (click)="toggleDarkMode()"
      [matTooltip]="isDarkMode ? 'Light mode' : 'Dark mode'"
    >
      <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <!-- Role switcher chip — only renders when the user was granted
         more than one role (e.g. Principal + HR). Shows the currently-
         active role and opens a dropdown with the other roles they can
         switch to. Hidden for single-role users so the top bar stays
         uncluttered. -->
    <button
      *ngIf="hasMultipleRoles"
      mat-stroked-button
      class="role-switcher-chip"
      [matMenuTriggerFor]="roleMenu"
      [disabled]="isSwitchingRole"
      matTooltip="Switch which role you're working as">
      <mat-icon class="role-switcher-icon">badge</mat-icon>
      <span class="role-switcher-label">{{ activeRoleLabel }}</span>
      <mat-icon class="role-switcher-caret">arrow_drop_down</mat-icon>
    </button>
    <mat-menu #roleMenu="matMenu" xPosition="before" class="role-switcher-menu">
      <div class="role-switcher-header" (click)="$event.stopPropagation()">
        <span class="role-switcher-header-label">Viewing as</span>
        <strong>{{ activeRoleLabel }}</strong>
      </div>
      <mat-divider></mat-divider>
      <button
        mat-menu-item
        *ngFor="let r of availableRoles"
        [disabled]="r === authService.activeRole || isSwitchingRole"
        (click)="switchRole(r)">
        <mat-icon>{{ r === authService.activeRole ? 'check' : 'swap_horiz' }}</mat-icon>
        <span>{{ roleLabel(r) }}</span>
      </button>
    </mat-menu>

    <!-- Sibling switcher — only renders when a student session has
         siblings under the same parentPhone. Hidden completely for
         staff / admin / principals (their `getSiblings` returns []). -->
    <app-sibling-switcher></app-sibling-switcher>

    <!-- Notifications bell → opens the Inbox tab on /notifications -->
    <button
      *ngIf="!isSuperAdmin"
      mat-icon-button
      class="header-icon-btn bell-btn"
      (click)="navigateToNotifications()"
      matTooltip="Notifications"
    >
      <mat-icon>notifications</mat-icon>
      <span class="bell-badge" *ngIf="unreadCount > 0">{{ badgeLabel }}</span>
    </button>

    <!-- User avatar and menu -->
    <button
      mat-icon-button
      [matMenuTriggerFor]="userMenu"
      class="avatar-btn"
      matTooltip="Account"
    >
      <div class="user-avatar">
        <img
          *ngIf="user?.profilePhotoUrl"
          [src]="user!.profilePhotoUrl"
          [alt]="userName"
          class="avatar-img"
        />
        <span *ngIf="!user?.profilePhotoUrl" class="avatar-text">{{ userInitial }}</span>
      </div>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before" class="user-menu">
      <div class="user-info" (click)="$event.stopPropagation()">
        <strong class="user-name">{{ userName }}</strong>
        <span class="user-email">{{ userEmail }}</span>
        <span class="user-role-badge">{{ roleDisplay }}</span>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="navigateToProfile()">
        <mat-icon>person</mat-icon>
        <span>My Profile</span>
      </button>
      <button mat-menu-item (click)="navigateToSettings()">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </button>
      <button mat-menu-item (click)="openChangePassword()">
        <mat-icon>lock_reset</mat-icon>
        <span>Change Password</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item class="logout-item" (click)="logout()">
        <mat-icon color="warn">logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
